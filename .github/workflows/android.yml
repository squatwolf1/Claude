name: APK 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # main 푸시 때 릴리스 올리기
    steps:
      - uses: actions/checkout@v4

      # 잠시 다른 곳에서 build-103 까지 배포했다. 이미 깔린 앱이 업데이트로 받을 수 있게 실행 번호에 100 을 더한다.
      - name: 빌드 번호
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        env:
          BUILD_NUMBER: ${{ env.BUILD }}
        run: |
          if [[ -f app/google-services.json ]]; then
            echo "::notice::google-services.json 있음 → 공유 모드로 빌드"
          else
            echo "::notice::google-services.json 없음 → 혼자 쓰기 모드로 빌드"
          fi
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk gagyebu.apk

      # PR·수동 실행 빌드는 Actions 산출물로 3일만 보관한다.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: gagyebu-apk-${{ github.sha }}
          path: gagyebu.apk
          retention-days: 3

      - name: 릴리스 올리기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD }}
          name: 빌드 ${{ env.BUILD }}
          make_latest: true
          files: gagyebu.apk
